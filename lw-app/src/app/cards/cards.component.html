<div class="stack">
  <app-pager *ngIf="shouldShowCardControls" [total]="filteredCards.length" [page]="normalizedCurrentPage" [pageSize]="pageSize" [pageSizeOptions]="pageSizeOptions" (pageChange)="currentPage = $event" (pageSizeChange)="setPageSize($event)">
    <div pagerSummary *ngIf="isSearchActive" class="cards-search-count">{{i18n.text().cards.found}} {{filteredCards.length}} {{i18n.text().cards.of}} {{cards.length}}</div>
    <label class="cards-search">
      <span class="visually-hidden">{{i18n.text().cards.search}}</span>
      <input type="search" class="form-control form-control-sm" [value]="searchQuery" (input)="changeSearchQuery($event)" [placeholder]="i18n.text().cards.searchPlaceholder" [attr.aria-label]="i18n.text().cards.search">
    </label>
  </app-pager>

  <section *ngIf="isSearchActive && filteredCards.length === 0" class="content-card cards-empty-state">
    <h2 class="h6 mb-1">{{i18n.text().cards.searchEmptyTitle}}</h2>
    <p class="text-muted mb-0">{{i18n.text().cards.searchEmptyIntro}}</p>
  </section>

  <app-card-frame *ngFor="let card of visibleCards; trackBy: trackByCardId" [wordCount]="card.words.length">
    <button cardActions type="button" class="word-card-delete" data-bs-toggle="modal" data-bs-target="#deleteCardModal" (click)="openDeleteModal(card)" [attr.aria-label]="i18n.text().cards.deleteThisCard"></button>
    <app-card [card]="card" [collectionId]="collectionId" (onCardRemoved)="removeCard($event)"></app-card>
  </app-card-frame>

  <div class="modal fade" id="deleteCardModal" tabindex="-1" aria-labelledby="deleteCardModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-sm">
      <div class="modal-content">
        <div class="modal-header">
          <h1 class="modal-title fs-5" id="deleteCardModalLabel">{{i18n.text().cards.deleteThisCardQuestion}}</h1>
          <button type="button" class="btn-close" data-bs-dismiss="modal" [attr.aria-label]="i18n.text().common.close"></button>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">{{i18n.text().common.close}}</button>
          <button (click)="deletePendingCard()" type="button" data-bs-dismiss="modal" class="btn btn-danger">{{i18n.text().common.delete}}</button>
        </div>
      </div>
    </div>
  </div>
</div>
